  # --- Generative / design tier (bio design stack, verified via HF API 2026-10-23) ---
  - id: rfd4-proteina
    function: "flow-matching protein backbone design (inference + reward-guided search)"
    role: generation_core
    license: "BSD-3-Clause"
    date_checked: "2026-10-23"
    source: "HF nvidia/RFD4-Proteina (0.4B / 435M params) + GitHub code + design benchmarks"
    sizes: "0.4B"
    commercial_ok: true
    derivative_ok: true
    hosted_by_us: true
    notes: "Flagship design model; bundles AF2/OpenFold3 refolding runtimes for designability eval — candidate RLVR reward signal, not just a tool. Permissive license. Supersedes NV-Proteina-400M-v1"

  - id: proteina-complexa
    function: "protein-complex design (binder / ligand-target)"
    role: generation
    license: "NVIDIA Open Model License"
    date_checked: "2026-10-23"
    source: "HF nvidia/NV-Proteina-Complexa-{Protein-Target,Ligand-Target,AME}-160M-v1"
    sizes: "160M each"
    commercial_ok: true
    derivative_ok: "fine-tune yes; verify redistribution + competing-model clause in NOML at use"
    hosted_by_us: true
    notes: "3 checkpoints (Protein-Target 952 dl, Ligand-Target, AME). NOT non-commercial, but NOML has clauses beyond BSD — confirm clause list before product shipping"

  - id: la-proteina
    function: "all-atom protein design (unconditional / motif-scaffold)"
    role: generation
    license: "NVIDIA Open Model License"
    date_checked: "2026-10-23"
    source: "HF nvidia/NV-La-Proteina-{Ucond,Motif}-v1 (arxiv 2507.09466)"
    sizes: "~16 GB ckpt store total"
    commercial_ok: true
    derivative_ok: "fine-tune yes; verify redistribution + competing-model clause in NOML at use"
    hosted_by_us: true
    notes: "2 checkpoints (Ucond 342 dl, Motif). Complements RFD4-Proteina (backbones) with all-atom output"

  - id: proteina-400m-legacy
    function: "legacy Proteina v1.4/v1.8 400M backbones"
    role: superseded
    license: "NVIDIA Source Code License v1 (nsclv1) — different from NOML"
    date_checked: "2026-10-23"
    source: "HF nvidia/NV-Proteina-400M-v1"
    sizes: "400M"
    commercial_ok: "TBD"
    derivative_ok: "TBD"
    hosted_by_us: true
    action: PREFER-RFD4
    notes: "NSCL v1 differs from both BSD and NOML — audit separately if ever needed. RFD4-Proteina is the replacement; do not onboard this without cause"

  - id: protgpt2
    function: "autoregressive protein sequence generation — MVP generate role (from-scratch replication target)"
    role: generation_core
    license: "Apache-2.0"
    date_checked: "2026-10-23"
    source: "HF nferruz/ProtGPT2 (verified Apache-2.0) · recipe: UniRef50 corpus + custom BPE tokenizer, GPT2LMHeadModel"
    sizes: "~800M reference; replication target ≤ 100M"
    commercial_ok: true
    derivative_ok: true
    hosted_by_us: true
    notes: "MVP generate (sequence). Plan: replicate recipe from scratch at smaller size (Kaggle T4); reference weights usable meanwhile. Trains on uniref50 (see datasets)"

  - id: moflow
    function: "invertible flow molecular-graph generation — MVP generate role (from-scratch replication target)"
    role: generation_core
    license: "MIT (official code: github.com/calvin-zcx/moflow, verified 2026-10-23)"
    date_checked: "2026-10-23"
    source: "github.com/calvin-zcx/moflow · data: MOSES ZINC250k (molecularsets/moses, MIT)"
    sizes: "~13-30M target"
    commercial_ok: true
    derivative_ok: true
    hosted_by_us: true
    notes: "MVP generate (molecule). From-scratch 30M on Kaggle T4x2; completely own checkpoint + recipe. Trains on moses-zinc250k"

  - id: chebi-agchem
    function: "positive reference set for M-MOFLOW-3 farm-knob steering (agrochemical role molecules w/ structures)"
    role: agri
    phase: "P1"
    license: "CC BY 4.0 (verified live 2026-10-23: github.com/ebi-chebi/ChEBI LICENSE + ebi.ac.uk/chebi training pages)"
    date_checked: "2026-10-23"
    source: "ftp.ebi.ac.uk/pub/databases/chebi (SDF all-2-3-star + ontology OWL/OBO); role tree: agrochemical CHEBI:33286 > herbicide CHEBI:24527 / insecticide CHEBI:24852 / fungicide CHEBI:24127"
    sizes: "hundreds of structured agrochemical entries (2-3 star)"
    commercial_ok: true
    derivative_ok: true
    hosted_by_us: true
    notes: "PLANNED, not yet downloaded (G1: manifest + sha256 written at fetch-verify time). Attribution ships with any release (C5 analog, phfm precedent). Molek steering consumes descriptor STATISTICS of positives, not bulk redistribution."

  - id: minilm-text
    function: "frozen text encoder for OWNED NLP intent layer (molecule arm), N-NLP-1"
    role: agri
    phase: "P2 (scope addition A8, Stan-authorized 2026-10-23)"
    license: "Apache-2.0 (verified live 2026-10-23: HF sentence-transformers/all-MiniLM-L6-v2 LICENSE file)"
    date_checked: "2026-10-23"
    source: "HF sentence-transformers/all-MiniLM-L6-v2 (384-d)"
    sizes: "~22M (frozen; we train only the projection head)"
    commercial_ok: true
    derivative_ok: true
    hosted_by_us: true
    notes: "Base encoder FROZEN; only our projection (intent-mol, N-NLP-1) is trained. Owned adapter, not a from-scratch large model (G9)."

  - id: protrek-text
    function: "protein-text aligned text encoder for OWNED NLP intent layer (protein arm), N-NLP-3"
    role: agri
    phase: "P2 (scope addition A8)"
    license: "MIT (verified live 2026-10-23: github.com/westlake-repl/ProTrek LICENSE)"
    date_checked: "2026-10-23"
    source: "HF westlake-repl/ProTrek_650M (text encoder 130M); Nature Biotech 2025"
    sizes: "130M text encoder (frozen)"
    commercial_ok: true
    derivative_ok: true
    hosted_by_us: true
    notes: "Frozen; sharpens the protein-intent arm vs MiniLM. Only our projection (intent-seq, N-NLP-2) is trained."

  - id: megamolbart
    function: "generative chemistry (SMILES BART autoencoder) — SERVED alt molecule generator beside Molek"
    role: generation_core
    phase: "P2 (from Stan's plan roster; serve-decision 2026-10-24)"
    license: "Apache-2.0 (verified live 2026-10-24: NVIDIA BioNeMo MegaMolBART model card / NVIDIA/MegaMolBART LICENSE)"
    date_checked: "2026-10-24"
    source: "github.com/NVIDIA/MegaMolBART · NGC nvcr.io/nvidia/clara/megamolbart"
    sizes: "45M (xsmall/small/large configs)"
    commercial_ok: true
    derivative_ok: true
    hosted_by_us: false
    notes: "SERVED (Stan decision 2026-10-24: alt generator, not from-scratch — Molek stays our owned one). /v1 mol.generate alt. Its numbers stay cited, never blended with Molek's (G7)."

  - id: diffdock
    function: "molecule<->protein pose prediction (blind docking) — SERVED tool in OUR generate->screen->optimize loop"
    role: generation_core
    phase: "P2 (Stan decision 2026-10-24: ours, FLORA never touches molecules)"
    license: "MIT (orig gcorso) / NVIDIA Open Model License (NVIDIA-trained v2.2+) — verified live 2026-10-24"
    date_checked: "2026-10-24"
    source: "github.com/gcorso/DiffDock (MIT) · build.nvidia.com/mit/diffdock (NIM)"
    sizes: "score + confidence models; served"
    commercial_ok: true
    derivative_ok: true
    hosted_by_us: false
    notes: "SERVED; we dock OUR generated molecules against targets (pose + confidence). Docking sits on the molecule-design side (FLORA is protein-analysis-only). Poses/scores cited as DiffDock's, never blended (G7)."

  - id: pinal
    function: "text->protein programmable design (natural-language -> 3Di structure -> sequence); SERVE-first (16B)"
    role: generation_core
    phase: "P3 (scope addition, Stan-authorized 2026-10-23)"
    license: "Apache-2.0 (verified live 2026-10-23: github.com/westlake-repl/Denovo-Pinal LICENSE)"
    date_checked: "2026-10-23"
    source: "github.com/westlake-repl/Denovo-Pinal · weights HF westlake-repl/Pinal (SaProt-T 760M, T2struc-1.2B, T2struc-15.5B)"
    sizes: "16B framework (T2struc-1.2B + SaProt-T 760M runnable on 1 GPU; T2struc-15B needs >=40GB)"
    deps: "built on SaProt (MIT) + ProTrek (MIT) — same westlake-repl group, open licenses"
    commercial_ok: true
    derivative_ok: true
    hosted_by_us: false
    notes: "SERVE via self-host (1.2B+SaProt-T) or online server; 16B not from-scratch on our compute (G9: served, not replicated). Paper: Dai/You/Zhu et al., Nature 2026 (s41586-026-11205-z); bioRxiv 2024.08.01.606258. Wet-lab validated (GFP + enzymes) BY THE AUTHORS — their result, cited not claimed (G7)."

