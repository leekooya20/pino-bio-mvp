# Bio specialist models — the understanding/embedding tier (docs/04-bio.md §4.1).
# These are TOOLS the orchestrator calls; they are deployed locally and LoRA-adapted,
# never merged into our base weights. Guardrail G1 applies to every entry.
bio_tools:
  - id: esm2
    function: "core protein embeddings + property/variant prediction"
    role: core
    license: "MIT"
    date_checked: "2026-10-23"
    source: "https://github.com/facebookresearch/esm · HF facebook/esm2_*"
    sizes: "8M-650M (15B optional)"
    commercial_ok: true
    derivative_ok: true
    hosted_by_us: true
    notes: "Primary embedding tool (esm.embed); MIT verified at time of entry — re-verify at use"

  - id: amplify
    function: "alternative protein embeddings (control/cross-check)"
    role: control
    license: "MIT"
    date_checked: "2026-10-23"
    source: "HF chandar-lab/AMPLIFY_120M / AMPLIFY_350M"
    sizes: "120M/350M"
    commercial_ok: true
    derivative_ok: true
    hosted_by_us: true
    notes: "Independent embedding model used to cross-check ESM-2 outputs; AGREE metric in verifier"

  - id: esmfold
    function: "3D structure prediction from single sequence"
    role: structure
    license: "MIT"
    date_checked: "2026-10-23"
    source: "facebookresearch/esm · HF facebook/esmfold_v1"
    sizes: "3B (with folding head)"
    commercial_ok: true
    derivative_ok: true
    hosted_by_us: true
    notes: "Fast folding for screening; slower/higher-accuracy alternatives below"

  - id: boltz2
    function: "3D structure prediction (complexes + co-folding)"
    role: structure
    license: "Apache-2.0 (code) / verify weights terms"
    date_checked: "2026-10-23"
    source: "https://github.com/jwohlwend/boltz"
    sizes: "Boltz-2 (32B NIM optional)"
    commercial_ok: "TBD"
    derivative_ok: "TBD"
    hosted_by_us: true
    notes: "Code permissive; confirm weight/distribution terms before product use"

  - id: chai1
    function: "3D structure prediction (complexes + immunogen focus)"
    role: structure
    license: "Apache-2.0 (code) / verify weights terms"
    date_checked: "2026-10-23"
    source: "https://github.com/chaidiscovery/chai-lab"
    sizes: "Chai-1 (monomer + complex)"
    commercial_ok: "TBD"
    derivative_ok: "TBD"
    hosted_by_us: true
    notes: "Weights historically carried their own community terms — audit before license-critical use"

  - id: geneformer
    function: "gene-expression representation"
    role: later
    phase: "P2"
    license: "Apache-2.0"
    date_checked: "2026-10-23"
    source: "HF ctheodoris/Geneformer (gene-lab mirror)"
    sizes: "10M-316M"
    commercial_ok: true
    derivative_ok: true
    hosted_by_us: true
